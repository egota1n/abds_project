services:
  # ClickHouse — основное аналитическое хранилище
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - ./infra/clickhouse/init:/docker-entrypoint-initdb.d
      # Кастомная конфигурация пользователей и прав
      - ./infra/clickhouse/users.xml:/etc/clickhouse-server/users.d/users.xml
    ulimits:
      # Рекомендуемые лимиты для ClickHouse
      nofile:
        soft: 262144
        hard: 262144

  # RabbitMQ — брокер сообщений для clickstream событий
  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "5672:5672"
      - "15672:15672"

  # Api — работа с сервисом
  api:
    build: ./services/api
    ports:
      - "4015:4015"
    depends_on:
      - clickhouse
    environment:
      - PYTHONUNBUFFERED=1

  # Generator – генерация данных для RabbitMQ
  generator:
    build: ./services/generator
    depends_on:
      - rabbitmq
    environment:
      - RABBIT_HOST=rabbitmq
      - RABBIT_QUEUE=clickstream.events
      - RATE_PER_SEC=30

  # Сonsumer – подписывается на сообщения от генератора
  consumer:
    build: ./services/consumer
    depends_on:
      - rabbitmq
      - api
    environment:
      - RABBIT_HOST=rabbitmq
      - RABBIT_QUEUE=clickstream.events
      - API_URL=http://api:4015/events
      - BATCH_SIZE=200
      - FLUSH_INTERVAL_SEC=1.0
  
  # CSV Loader – загрузка первичных данных с помощью csv
  csv_loader:
    build: ./services/csv_loader
    depends_on:
      - api
    environment:
      - API_URL=http://api:4015/events
      - CSV_PATH=/data/events.csv
      - CHUNK=500
    volumes:
      - ./data:/data
    profiles:
      - manual