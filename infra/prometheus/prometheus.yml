global:
  scrape_interval: 5s

scrape_configs:
  # Метрики FastAPI приложения
  - job_name: "api"
    metrics_path: /metrics
    static_configs:
      - targets: ["api:4015"]
  
  # Метрики хоста (CPU, RAM, диск, сеть)
  - job_name: "node"
    static_configs:
      - targets: ["node_exporter:9100"]
  
  # Метрики RabbitMQ
  - job_name: "rabbitmq"
    static_configs:
      - targets: ["rabbitmq:15692"]